<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Smartshop – Vue groupe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
    --paper:#EDF4FA;--surface:#F6FAFD;--surface-2:#FFFFFF;--ink:#1D1D1B;--muted:#5E6B78;--line:#DCE6EF;--line-strong:#C4D3E0;
  --head:#EDF4FA;--head-ink:#1D1D1B;--head-muted:#636976;
  --sign:#FEEB1B;--sign-ink:#1D1D1B;--cyan:#1D9DD9;--cyan-deep:#0E6FB5;--magenta:#E50C7E;--focus:#E50C7E;
  --teal:#1D9DD9;--teal-rgb:29,157,217;--teal-ink:#0B6AA6;--brick:#C8096C;--brick-soft:rgba(229,12,126,.1);--sleep:#5B6068;--sleep-soft:rgba(29,29,27,.07);
  --gold-soft:rgba(254,235,27,.28);--cyan-soft:rgba(29,157,217,.12);
  --sh-d:rgba(120,160,195,.32);--sh-l:rgba(255,255,255,1);
  --raise:9px 9px 20px var(--sh-d),-9px -9px 20px var(--sh-l);
  --raise-sm:5px 5px 12px var(--sh-d),-5px -5px 12px var(--sh-l);
  --raise-xs:3px 3px 7px var(--sh-d),-3px -3px 7px var(--sh-l);
  --inset:inset 4px 4px 9px var(--sh-d),inset -4px -4px 9px var(--sh-l);
  --inset-sm:inset 2px 2px 5px var(--sh-d),inset -2px -2px 5px var(--sh-l);
  --grad:linear-gradient(135deg,#34B3E8 0%,#1D9DD9 40%,#0E6FB5 100%);
  --grad-mag:linear-gradient(135deg,#F2539F,#E50C7E 55%,#B5085F);
  --r:22px;--r-sm:14px;
  --g1:#1D9DD9;--g2:#E50C7E;--g3:#E3B505;--g4:#2E9E6B;--g5:#7A4FBF;--g6:#F07C2A;--g7:#5C8FA8;--g8:#A0A6B0;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1B1E24;--surface:#22262D;--surface-2:#282D35;--ink:#ECEEF2;--muted:#9AA2AE;--line:#2F353E;--line-strong:#3E4651;
  --head:#1B1E24;--head-ink:#ECEEF2;--head-muted:#9AA2AE;
  --cyan:#2FAAE3;--cyan-deep:#1683C9;--magenta:#F2539F;--focus:#F2539F;
  --teal:#2FAAE3;--teal-rgb:47,170,227;--teal-ink:#7BCBF2;--brick:#F2539F;--brick-soft:rgba(242,83,159,.16);--sleep:#B9C0CA;--sleep-soft:rgba(236,238,242,.08);
  --gold-soft:rgba(254,235,27,.14);--cyan-soft:rgba(47,170,227,.16);
  --sh-d:rgba(0,0,0,.55);--sh-l:rgba(255,255,255,.045);
  --grad:linear-gradient(135deg,#3DB9EE 0%,#2FAAE3 40%,#1476BB 100%);
  --g1:#3DB2EA;--g2:#F2539F;--g3:#F2CC3D;--g4:#45BE87;--g5:#9E7BE0;--g6:#F79A55;--g7:#86B3C9;--g8:#6F7680;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1B1E24;--surface:#22262D;--surface-2:#282D35;--ink:#ECEEF2;--muted:#9AA2AE;--line:#2F353E;--line-strong:#3E4651;
  --head:#1B1E24;--head-ink:#ECEEF2;--head-muted:#9AA2AE;
  --cyan:#2FAAE3;--cyan-deep:#1683C9;--magenta:#F2539F;--focus:#F2539F;
  --teal:#2FAAE3;--teal-rgb:47,170,227;--teal-ink:#7BCBF2;--brick:#F2539F;--brick-soft:rgba(242,83,159,.16);--sleep:#B9C0CA;--sleep-soft:rgba(236,238,242,.08);
  --gold-soft:rgba(254,235,27,.14);--cyan-soft:rgba(47,170,227,.16);
  --sh-d:rgba(0,0,0,.55);--sh-l:rgba(255,255,255,.045);
  --grad:linear-gradient(135deg,#3DB9EE 0%,#2FAAE3 40%,#1476BB 100%);
  --g1:#3DB2EA;--g2:#F2539F;--g3:#F2CC3D;--g4:#45BE87;--g5:#9E7BE0;--g6:#F79A55;--g7:#86B3C9;--g8:#6F7680;
  color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
h1{margin:0;font-weight:900;font-size:clamp(22px,2.4vw,30px);line-height:1.05}
h2{font-weight:900;font-size:22px;margin:0 0 12px}
h3{font-weight:800;font-size:16px;margin:0 0 12px}
.muted{color:var(--muted)}
.wrap{max-width:1380px;margin:0 auto;padding:24px 30px 60px}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:18px}
.brand svg.logo{height:52px;width:auto;color:var(--ink)}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
select{appearance:none;-webkit-appearance:none;border:0;background:var(--paper);color:var(--ink);box-shadow:var(--inset-sm);border-radius:12px;padding:9px 34px 9px 14px;font-weight:700;font-size:14px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.period-sign{background:var(--sign);color:var(--sign-ink);font-weight:900;padding:9px 16px;border-radius:99px;font-size:14px;white-space:nowrap;box-shadow:var(--raise-xs)}
.theme-sw{position:relative;display:inline-flex;align-items:center;cursor:pointer;user-select:none}
.theme-sw input{position:absolute;opacity:0;width:1px;height:1px}
.theme-sw .tr{position:relative;width:74px;height:36px;border-radius:99px;background:var(--paper);box-shadow:var(--inset-sm);transition:background .2s}
.theme-sw .kn{position:absolute;top:3px;left:3px;width:30px;height:30px;border-radius:50%;background:var(--surface-2);box-shadow:var(--raise-xs);transition:transform .25s}
.theme-sw .lbl{position:absolute;right:11px;top:0;line-height:36px;font-size:11px;font-weight:900;letter-spacing:.04em;color:var(--muted)}
.theme-sw .lbl::after{content:"JOUR"}
.theme-sw input:checked+.tr{background:var(--grad);box-shadow:none}
.theme-sw input:checked+.tr .kn{transform:translateX(38px)}
.theme-sw input:checked+.tr .lbl::after{content:"NUIT"}
.theme-sw input:checked+.tr .lbl{color:#fff;right:auto;left:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:16px;margin-bottom:26px}
.kpi{background:var(--surface);border-radius:var(--r-sm);padding:16px 18px 14px;box-shadow:var(--raise-sm);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:18px;right:18px;top:0;height:4px;border-radius:0 0 4px 4px;background:var(--grad)}
.kpi b{display:block;font-weight:900;font-size:clamp(21px,2.1vw,28px);line-height:1.1;margin-top:6px}
.kpi span{font-size:13px;color:var(--muted);display:block;margin-top:2px}
.kpi small{display:block;font-size:12px;color:var(--muted);margin-top:4px;font-weight:700}
.up{color:var(--g4)}.down{color:var(--brick)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:24px}
.box{background:var(--surface);border-radius:var(--r);padding:22px 24px;margin-bottom:24px;min-width:0;box-shadow:var(--raise)}
.box-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.box-head h3{margin:0}
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:99px;background:var(--paper);box-shadow:var(--inset-sm)}
.seg button{border:0;background:none;padding:6px 14px;cursor:pointer;font-size:13px;font-weight:800;color:var(--muted);border-radius:99px}
.seg button[aria-pressed="true"]{background:var(--grad);color:#fff}
.tw{overflow-x:auto;border-radius:var(--r-sm);background:var(--surface-2);box-shadow:var(--inset-sm);padding:2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child>td{border-bottom:0}
th{font-weight:800;font-size:12.5px;color:var(--muted);background:var(--surface-2);white-space:nowrap;text-transform:uppercase;letter-spacing:.03em}
td.n,th.n{text-align:right;white-space:nowrap}
td.c b{font-weight:900}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px}
svg.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
svg.chart .grid{stroke:var(--line)}
svg.chart .ln{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:4px;border-radius:2px;display:inline-block}
.empty{padding:28px;text-align:center;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
a.lnk{color:var(--teal-ink);font-weight:800;text-decoration:none}
a.lnk:hover{text-decoration:underline}
.gate{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px;z-index:80}
.gate[hidden]{display:none}
.gate-card{background:var(--surface);border-radius:var(--r);max-width:520px;width:100%;padding:30px 32px;box-shadow:var(--raise)}
.gate-card h1{font-size:26px;margin:0 0 8px}.gate-card p{color:var(--muted)}
.gbtn{border:0;cursor:pointer;font-weight:800;border-radius:99px;background:var(--surface);color:var(--ink);box-shadow:var(--raise-sm);padding:10px 18px;font-size:15px}
.gbtn.primary{background:var(--grad);color:#fff}
.gerr{color:var(--brick);font-weight:800}
.user-chip{position:fixed;right:16px;bottom:16px;background:var(--surface);border-radius:99px;padding:6px 8px 6px 16px;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;z-index:40;box-shadow:var(--raise-sm)}
.user-chip[hidden]{display:none}
.user-chip button{border:0;background:var(--paper);border-radius:99px;padding:6px 12px;font-weight:800;cursor:pointer;color:var(--ink);box-shadow:var(--inset-sm)}
.err-list{color:var(--brick);font-weight:700;font-size:13px}
@media (max-width:640px){.wrap{padding:16px 16px 50px}.kpis{grid-template-columns:repeat(2,1fr);gap:12px}.box{padding:18px 16px}}
</style>
</head>

<script>
(function(){

(function(){const sw=document.getElementById('themeSw');let saved=null;try{saved=localStorage.getItem('ss-theme')}catch(e){}

/* --- normalisation d'un client --- */
function normalize(c,base,ds,settings){
  let orders,products;
  if(ds){products=ds.products;orders=ds.orders.map(r=>({d:r[1],t:r[2],r:r[4],c:r[5],i:r[6],a:String(r[10]||'').trim().toUpperCase()+'|'+(r[8]||''),s:r[11]||0}))}
  else{products=base.products;orders=base.orders.map(o=>({d:o.d,t:o.t,r:o.r,c:o.c||[],i:o.i,a:'a'+o.a,s:o.s||0,m:!!(base.agnet&&base.agnet[o.a]&&base.agnet[o.a][0]>=0)}))}

  return {cmd:ords.length,ca,net:ca-rem,basket:ca/ords.length,ag,prod:new Set(ords.flatMap(o=>o.i.map(x=>x[0]))).size,code:ords.filter(o=>o.c.length).length/ords.length,

}

function dl(a,b,inv){if(!b)return '';const d=(a-b)/b*100;const good=inv?d<0:d>0;return `<small class="${Math.abs(d)<.05?'':good?'up':'down'}">${d>0?'+':''}${nf1.format(d)} % vs 12 mois précédents</small>`}
function lineChart(el,keys,series,fmt){
  const w=Math.max(300,el.clientWidth||700),h=280,pl=54,pr=12,pt=12,pb=30,iw=w-pl-pr,ih=h-pt-pb;

  const X=i=>pl+iw*(keys.length>1?i/(keys.length-1):.5),Y=v=>pt+ih-ih*v/nice,step=Math.ceil(keys.length/Math.max(1,Math.floor(iw/52)));
  let s=`<svg class="chart" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img">`;
  for(let k=0;k<=4;k++){const y=pt+ih-ih*k/4;s+=`<line class="grid" x1="${pl}" x2="${w-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${fmt(nice*k/4)}</text>`}
  keys.forEach((k,i)=>{if(i%step===0)s+=`<text x="${X(i)}" y="${h-10}" text-anchor="middle">${MOIS[+k.slice(5,7)-1]} ${k.slice(2,4)}</text>`});
  series.forEach(se=>{s+=`<path class="ln" stroke="${se.col}" d="${se.vals.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('')}"/>`;se.vals.forEach((v,i)=>{s+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3" fill="${se.col}"><title>${esc(se.l)} · ${MOIS[+keys[i].slice(5,7)-1]} ${keys[i].slice(0,4)} : ${esc(fmt(v))}</title></circle>`})});

    <div class="kpi"><b>${eur.format(tot('ca'))}</b><span>CA HT produits</span>${S.year==='all'?`<small>12 derniers mois : ${eur.format(tot12('ca'))}</small>${dl(tot12('ca'),tot24('ca'))}`:''}</div>
    <div class="kpi"><b>${eur.format(tot('net'))}</b><span>CA HT après remises</span></div>
    <div class="kpi"><b>${nf.format(tot('ag'))}</b><span>agences clientes</span></div>
    ${anyComm?`<div class="kpi"><b>${eur.format(tot('comm'))}</b><span>commissions reversées</span></div>`:''}
    ${anyShip?`<div class="kpi"><b>${eur.format(tot('ship'))}</b><span>frais de port facturés</span></div>`:''}
    <div class="kpi"><b>${DATA.length}</b><span>réseaux suivis</span><small>dernière commande : ${fd(L)}</small></div>
  </div>
  <div class="box"><div class="box-head"><h3>Comparaison des réseaux</h3></div><div class="tw"><table><thead><tr><th>Réseau</th><th class="n">Commandes</th><th class="n">CA HT</th><th class="n">Panier moyen</th><th class="n">Agences clientes</th><th class="n">Taux de pénétration</th><th class="n">Produits vendus</th><th class="n">Commandes avec code</th>${anyComm?'<th class="n">Commissions</th>':''}<th>Typologie n°1</th><th class="n">12 derniers mois</th><th>Période</th></tr></thead><tbody>
  ${rows.map((r,k)=>{const K=r.K;return `<tr><td class="c"><span class="sw" style="background:${COL[k%COL.length]}"></span><b>${esc(r.c.name)}</b>${r.c.url?` · <a class="lnk" href="${esc(r.c.url)}" target="_blank" rel="noopener">ouvrir</a>`:''}</td>${K?`<td class="n"><b>${nf.format(K.cmd)}</b></td><td class="n">${eur.format(K.ca)}</td><td class="n">${eur.format(K.basket)}</td><td class="n">${nf.format(K.ag)}</td><td class="n">${r.c.network&&r.c.penOK?pct(K.penN/r.c.network)+' <span class="muted">('+nf.format(K.penN)+' / '+nf.format(r.c.network)+')</span>':'–'}</td><td class="n">${nf.format(K.prod)}</td><td class="n">${pct(K.code)}</td>${anyComm?`<td class="n">${r.c.commission?eur.format(K.comm)+' <span class="muted">('+nf1.format(r.c.commission*100)+' %)</span>':'–'}</td>`:''}<td>${esc(K.topCat)}</td><td class="n">${r.K12?nf.format(r.K12.cmd)+' cmd '+dl(r.K12.cmd,r.K24&&r.K24.cmd).replace('vs 12 mois précédents',''):'–'}</td><td class="muted">${fd(r.c.first)} → ${fd(r.c.last)}</td>`:`<td colspan="10" class="muted">Aucune commande sur la période</td>`}</tr>`}).join('')}
  </tbody></table></div><p class="note">Taux de pénétration : part des agences de l'annuaire du réseau ayant commandé (uniquement si un annuaire est intégré et tant que les commandes n'ont pas été réimportées depuis l'outil ; ouvrez l'outil du réseau pour la valeur à jour). Montants HT, produits uniquement, avant remise sauf mention contraire.</p></div>
  <div class="box"><div class="box-head"><h3 id="chT"></h3><div class="seg" role="group"><button data-m="cmd">Commandes</button><button data-m="ca">CA HT</button></div></div><div id="ch"></div><div class="legend" id="chL"></div></div>
  <div class="grid2">
    <div class="box"><h3>Part de chaque réseau dans le CA HT</h3><div id="share"></div></div>
    <div class="box"><h3>Commandes par agence cliente</h3><div id="perAg"></div><p class="note">Nombre moyen de commandes par agence sur la période : mesure la fidélité des agences de chaque réseau.</p></div>
  </div>`;
  const draw=()=>{
    const keys=[];const end=L.slice(0,7);let k=S.year==='all'?addMonths(end,-23):S.year+'-01';const stop=S.year==='all'?end:S.year+'-12';while(k<=stop){keys.push(k);k=addMonths(k,1)}
    const series=DATA.map((c,i)=>{const m=new Map(keys.map(k=>[k,0]));c.orders.forEach(o=>{if(m.has(o.ym))m.set(o.ym,m.get(o.ym)+(S.metric==='cmd'?1:o.t))});return {l:c.name,col:COL[i%COL.length],vals:[...m.values()]}});
    document.getElementById('chT').textContent=(S.metric==='cmd'?'Commandes':'CA HT')+' par mois et par réseau'+(S.year==='all'?' (24 derniers mois)':'');
    lineChart(document.getElementById('ch'),keys,series,S.metric==='cmd'?v=>nf.format(Math.round(v)):v=>nf.format(Math.round(v/1000))+' k€');
    document.getElementById('chL').innerHTML=series.map(s=>`<span><i style="background:${s.col}"></i>${esc(s.l)}</span>`).join('');
    app.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===S.metric));
    const bars=(id,items,fmt)=>{const mx=Math.max(1,...items.map(x=>x.v));document.getElementById(id).innerHTML=items.map((x,i)=>`<div style="display:grid;grid-template-columns:140px 1fr 90px;gap:12px;align-items:center;padding:7px 0"><b>${esc(x.l)}</b><div style="height:10px;border-radius:5px;background:var(--paper);box-shadow:var(--inset-sm);overflow:hidden"><i style="display:block;height:100%;width:${(x.v/mx*100).toFixed(1)}%;background:${COL[i%COL.length]}"></i></div><span style="text-align:right;font-weight:800">${fmt(x.v)}</span></div>`).join('')};
    const caTot=tot('ca')||1;bars('share',rows.map(r=>({l:r.c.name,v:r.K?r.K.ca:0})),v=>eur.format(v)+' · '+pct(v/caTot));
    bars('perAg',rows.map(r=>({l:r.c.name,v:r.K?r.K.cmd/r.K.ag:0})),v=>nf1.format(v));
  };
  app.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{S.metric=b.dataset.m;draw()});
  draw();window.onresize=draw;
}
function start(data){
  DATA=data.filter(c=>c.orders.length);
  const years=[...new Set(DATA.flatMap(c=>c.orders.map(o=>o.y)))].sort();
  const fy=document.getElementById('fYear');fy.innerHTML='<option value="all">Toutes les années</option>'+years.map(y=>`<option>${y}</option>`).join('');fy.onchange=()=>{S.year=fy.value;render()};
  document.getElementById('sub').textContent=DATA.map(c=>c.name).join(', ')+' · commandes jusqu\'au '+fd(LAST());
  render();
}
window.__groupStart=start;window.__normalize=normalize;
})();
</script>

<script>
(function(){

firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),fs=firebase.firestore();
function loginScreen(msg){chip.hidden=true;show('<h1>Vue groupe Smartshop</h1><p>Consolidation de tous les réseaux clients. Réservé à l\'équipe Smartshop : connectez-vous avec votre compte Google professionnel.</p>'+(msg?'<p class="gerr">'+esc(msg)+'</p>':'')+'<button class="gbtn primary" id="gLogin">Se connecter avec Google</button>');
  document.getElementById('gLogin').onclick=async()=>{try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')loginScreen('La connexion a échoué ('+(e.code||e.message)+').')}}}
async function readBase(prefix){const m=await fs.collection(prefix+'_base').doc('meta').get();if(!m.exists)return null;let s='';for(let k=0;k<m.data().parts;k++){const p=await fs.collection(prefix+'_base').doc('part_'+k).get();if(!p.exists)throw new Error('Données incomplètes');s+=p.data().s}return JSON.parse(s)}
async function readDoc(prefix,name){const d=await fs.collection(prefix+'_datasets').doc(name).get();return d.exists?JSON.parse(d.data().json):null}
async function readOrders(prefix){const meta=await readDoc(prefix,'commandes');if(!meta)return null;const orders=[];for(let k=0;k<meta.chunks;k++){const c=await readDoc(prefix,'commandes_'+k);if(!c)return null;orders.push(...c.orders)}return {products:meta.products,orders}}
async function start(u){

      let ds=null,settings=null;try{ds=await readOrders(c.prefix)}catch(e){}try{settings=await readDoc(c.prefix,'settings')}catch(e){}

}
